<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | finntozerdesign</title>
  <meta name="robots" content="noindex">
  <!-- GitHub Pages shows this page for any address that doesn't exist.
       Styles are written in here (not in styles.css) so it still looks right
       at any address. Links use "/" = the home page of finntozerdesign.github.io -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem;
           font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #111; background: #fff; }
    main { max-width: 34rem; }
    svg { width: 4rem; height: auto; }
    svg .b3 { fill: #ff4f00; }
    h1 { font-size: clamp(2.2rem, 7vw, 4rem); letter-spacing: -0.03em; line-height: 1; margin: 1.5rem 0 1rem; }
    a { color: #111; text-underline-offset: 0.2em; }
    a:focus-visible { outline: 3px solid #ff4f00; outline-offset: 3px; }
    p { font-size: 1.1rem; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 30 20" aria-hidden="true" focusable="false">
      <rect x="0" y="0" width="4" height="10"/><rect x="5" y="0" width="4" height="20"/><rect class="b3" x="10" y="0" width="20" height="4"/><rect x="10" y="5" width="10" height="4"/>
    </svg>
    <h1>This record isn’t on the stand.</h1>
    <p>The page you were looking for doesn’t exist or has moved.</p>
    <p><a href="/">Back to finntozerdesign →</a></p>
  </main>
</body>
</html>
